[package]
name = "size_test"
version = "0.1.0"
authors = ["Matthias Krüger <matthias.krueger@famsik.de>"]

[dependencies]
# some packages that don't have any dependencies so we can know their exact sizes
cc = "1.11.3"
pkg-config = "0.3.34"
libc = "0.2.191"
unicode-xid = "0.2.6"
rustc_tools_util = "0.4.2"
clippy_travis_test = { git =  "https://github.com/matthiaskrgr/clippy_travis_test"}
clippy = { git =  "https://github.com/rust-lang/rust-clippy"}
